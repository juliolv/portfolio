(function () {
  var skins = ['ayu-dark', 'ayu-light', 'catppuccin-mocha', 'catppuccin-latte', 'dracula', 'tokyo-night', 'nord', 'rose-pine', 'rose-pine-dawn'], c = null, r = document.documentElement;
  try { c = localStorage.getItem('tui.skin'); } catch (e) {}
  var n = skins.indexOf(c) > -1 ? c : 'system';
  if (n === 'system') {
    var ht = r.getAttribute('data-theme');
    n = (ht === 'light' || (ht !== 'dark' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches)) ? 'ayu-light' : 'ayu-dark';
  }
  r.setAttribute('data-skin', n);
  r.classList.add('js');
})();

/* ==========================================================================
   TOKENS
   Layout concept: a TUI. Transcript column (prompt lines, tool calls, results)
   beside a file/todo sidebar, with a prompt + status line docked at the bottom.
   Skins are open-source themes (Catppuccin, Dracula, Tokyo Night, Nord, Rosé Pine,
   Ayu) mapped onto the same tokens and scoped by [data-skin], so any element can
   preview one. Each theme keeps its own official accent, green, yellow and red; values

   ========================================================================== */

  --bg: #0d1017; --panel: #0f131a; --element: #131721; --border: #1c212b; --border-strong: #6c7380;
  --text: #bfbdb6; --muted: #9499a2; --accent: #e6b450; --accent-fg: #0d1017; --accent-subtle: #312d23;
  --ok: #aad94c; --warn: #ffb454; --danger: #d95757; --select: #273747; --shadow: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

  --ok: #5a7800; --warn: #8c652a; --danger: #c44444; --select: #d8e6f6; --shadow: rgba(40, 40, 60, 0.18);
  color-scheme: light;

}

/* devlog todo */
.todo { display: flex; flex-direction: column; }

.glog { margin-left: 6px; border-left: var(--bw) solid var(--border-strong); }

.glog__item--edu::before { background: var(--muted); }

.glog__org { color: var(--muted); }
.glog__when { font-size: var(--fs-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.glog__text { margin-top: var(--sp-2); max-width: 66ch; color: var(--muted); }

/* stack trees */
.trees { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-5) var(--sp-5); }

.tree li:last-child::before { content: "└── "; content: "└── " / ""; }

/* contact + search hits */

.contact__email { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); }
.contact__addr { font-size: clamp(15px, 3.6vw, 20px); overflow-wrap: anywhere; user-select: all; }
.colophon { margin-top: var(--sp-5); padding-top: var(--sp-4); border-top: var(--bw) solid var(--border); font-size: var(--fs-1); color: var(--muted); }

.tab:hover, .tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"] { border-bottom-color: var(--accent); }
.tabpanel { padding-top: var(--sp-5); }
.tabpanel:not([hidden]) { animation: fade var(--dur-base) var(--ease-out); }
.ds-group { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: var(--sp-3) var(--sp-5); padding-block: var(--sp-5); border-top: var(--bw) solid var(--border); }
.ds-group:first-child { border-top: 0; padding-top: 0; }
.ds-group > h3 { font-size: var(--fs-2); font-weight: 400; color: var(--muted); }
.ds-group > div { min-width: 0; }
@media (max-width: 700px) { .ds-group { grid-template-columns: minmax(0, 1fr); } }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--sp-3); }

.swatch__chip { height: 40px; border-bottom: var(--bw) solid var(--border); }
.swatch__meta { padding: var(--sp-2) var(--sp-3); font-size: var(--fs-1); line-height: 1.5; }
.swatch__meta span { display: block; color: var(--muted); }
.rows2 { display: flex; flex-direction: column; }
.row2 { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: var(--sp-4); align-items: center; padding: var(--sp-2) 0; border-top: var(--bw) solid var(--border); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.row2:first-child { border-top: 0; }
.row2 code { font: inherit; font-size: var(--fs-1); color: var(--muted); }
.row2__bar { height: 10px; background: var(--accent); }
.row2__sample { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { position: relative; height: 10px; border-bottom: var(--bw) solid var(--border-strong); }
.track i { position: absolute; left: 0; bottom: -1px; width: 10px; height: 10px; background: var(--accent); transition-property: left; }
.is-on .track i { left: calc(100% - 10px); }
.shapes { display: flex; flex-wrap: wrap; gap: var(--sp-3); }
.shape { width: 56px; height: 40px; display: inline-flex; align-items: center; justify-content: center; font-size: var(--fs-1); color: var(--muted); background: var(--panel); border: var(--bw) solid var(--border-strong); }
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: var(--sp-4); }
.skin-card { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-2); text-align: left; background: transparent; border: var(--bw) solid var(--border); border-radius: var(--r-box); transition: border-color var(--dur-fast); }
.skin-card:hover { border-color: var(--border-strong); }

.mini__bar i:nth-child(1) { background: var(--accent); } .mini__bar i:nth-child(2) { background: var(--ok); } .mini__bar i:nth-child(3) { background: var(--warn); }

@media (max-width: 700px) { .specs { grid-template-columns: minmax(0, 1fr); } }

</style>

<body>
<div class="app">
  <header class="titlebar"><div class="titlebar__row">
    <a class="brand" href="/portfolio/"><span class="brand__logo" aria-hidden="true"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="7" y="3.5" width="3" height="3" fill="var(--accent)"/><path d="M8.5 9.5V18a3 3 0 0 1-3 3H3" fill="none" stroke="var(--accent)" stroke-width="3"/><rect x="13" y="3.5" width="7" height="14.5" fill="var(--text)"/></svg></span>julio<span class="brand__crumb">/404</span></a>
  </div></header>
  <main class="transcript" style="padding-right:0">
    <section class="turn" style="margin-top:var(--sp-6)" aria-labelledby="nf-h">
      <h1 class="turn__prompt" id="nf-h"><span class="turn__glyph" aria-hidden="true">❯</span><span>cd <span id="path">/missing-page</span></span></h1>
      <p class="tool"><span class="tool__dot" style="color:var(--danger)" aria-hidden="true">●</span><span class="tool__name">Error</span><span class="tool__arg">(404)</span></p>
      <div class="result">
        <p data-l="msg">This page does not exist. The link may be old or have a typo.</p>
        <p class="muted" style="margin-top:var(--sp-2)" data-l="try">Try one of these:</p>
        <div class="hits" style="margin-top:var(--sp-3)">
          <a class="btn btn--primary" href="/portfolio/"><span aria-hidden="true">~</span> <span data-l="home">Go to the portfolio</span></a>
          <a class="btn" href="/portfolio/#work">/work</a>
          <a class="btn" href="/portfolio/#devlog">/devlog</a>
          <a class="btn" href="/portfolio/#contact">/contact</a>
        </div>
      </div>
    </section>
  </main>
</div>
<script>
(function () {
  var es = { msg: 'Esta página no existe. El enlace puede ser antiguo o tener un error.', try: 'Prueba una de estas:', home: 'Ir al portfolio' };
  var l = null; try { l = localStorage.getItem('tui.lang'); } catch (e) {}
  if (!l) l = /^es\b/i.test(navigator.language || '') ? 'es' : 'en';
  document.getElementById('path').textContent = decodeURIComponent(location.pathname);
  if (l === 'es') {
    document.documentElement.lang = 'es'; document.title = '404 · Julio López';
    Array.prototype.forEach.call(document.querySelectorAll('[data-l]'), function (el) { el.textContent = es[el.getAttribute('data-l')]; });
  }
})();
</script>
