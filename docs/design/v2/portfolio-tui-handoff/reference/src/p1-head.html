<script>
(function () {
  var skins = ['ayu-dark', 'ayu-light', 'catppuccin-mocha', 'catppuccin-latte', 'dracula', 'tokyo-night', 'nord', 'rose-pine', 'rose-pine-dawn'], c = null, r = document.documentElement;
  try { c = localStorage.getItem('tui.skin'); } catch (e) {}
  var n = skins.indexOf(c) > -1 ? c : 'system';
  if (n === 'system') {
    var ht = r.getAttribute('data-theme');
    n = (ht === 'light' || (ht !== 'dark' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches)) ? 'ayu-light' : 'ayu-dark';
  }
  r.setAttribute('data-skin', n);
  r.classList.add('js');
})();

/* ==========================================================================
   TOKENS
   Layout concept: a TUI. Transcript column (prompt lines, tool calls, results)
   beside a file/todo sidebar, with a prompt + status line docked at the bottom.
   Skins are open-source themes (Catppuccin, Dracula, Tokyo Night, Nord, Rosé Pine,
   Ayu) mapped onto the same tokens and scoped by [data-skin], so any element can
   preview one. Each theme keeps its own official accent, green, yellow and red; values
   that fail WCAG AA are darkened or lightened just enough to pass.
   ========================================================================== */
:root, [data-skin="ayu-dark"] {
  --bg: #0d1017; --panel: #0f131a; --element: #131721; --border: #1c212b; --border-strong: #6c7380;
  --text: #bfbdb6; --muted: #9499a2; --accent: #e6b450; --accent-fg: #0d1017; --accent-subtle: #312d23;
  --ok: #aad94c; --warn: #ffb454; --danger: #d95757; --select: #273747; --shadow: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}
[data-skin="ayu-light"] {
  --bg: #fcfcfc; --panel: #f8f9fa; --element: #f3f4f5; --border: #e7eaed; --border-strong: #868d94;

:root {
  --font: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  --fs-1: 12px; --fs-2: 13px; --fs-3: 14px; --fs-4: 16px; --fs-5: 20px; --fs-6: 28px;
  --fs-7: clamp(30px, 6.2vw, 48px);

  --r-0: 0; --r-1: 2px; --r-box: 6px; --bw: 1px; --bw-2: 2px;
  --elev: 0 20px 50px -20px var(--shadow);
  --z-bar: 20; --z-dock: 30; --z-menu: 35; --z-dialog: 50; --z-tip: 60;
  --dur-fast: 120ms; --dur-base: 220ms; --dur-slow: 520ms;
  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);

}
@media (max-width: 899px) { :root { --bar-h: 89px; } }
/* Desktop scale: text grows with the screen so a 1440–1920px monitor isn't reading 12–14px type. */
@media (min-width: 1200px) {
  :root { --fs-1: 13px; --fs-2: 14px; --fs-3: 15px; --fs-4: 17px; --fs-5: 21px; --fs-7: clamp(40px, 3.4vw, 54px); --side-w: 304px; --app-w: 1360px; }
}
@media (min-width: 1600px) {
  :root { --fs-1: 14px; --fs-2: 15px; --fs-3: 16px; --fs-4: 18px; --fs-5: 22px; --fs-7: clamp(48px, 3.2vw, 60px); --side-w: 336px; --app-w: 1520px; }
}
@media (prefers-reduced-motion: reduce) { :root { --dur-fast: 0ms; --dur-base: 0ms; --dur-slow: 0ms; } }

@keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sweep { from { box-shadow: inset 0 0 0 1px var(--accent); } to { box-shadow: inset 0 0 0 1px transparent; } }

/* ==========================================================================
   BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--fs-3); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: var(--z-dialog); background: var(--bg); }
::selection { background: var(--select); color: var(--text); }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: var(--bw-2) solid var(--accent); outline-offset: 2px; }
h1[tabindex="-1"]:focus:not(:focus-visible), h2[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.theme-anim, .theme-anim *, .theme-anim *::before, .theme-anim *::after {
  transition: background-color var(--dur-base) var(--ease-in-out), color var(--dur-base) var(--ease-in-out),
    border-color var(--dur-base) var(--ease-in-out), fill var(--dur-base) var(--ease-in-out) !important;
}
.reveal { transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out); }
.reveal.is-pending { opacity: 0; transform: translateY(10px); }
.app { max-width: var(--app-w, 1280px); margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
